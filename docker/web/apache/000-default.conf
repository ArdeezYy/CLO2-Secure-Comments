<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^([^:]+)
    RewriteRule ^ https://%1:8443%{REQUEST_URI} [R=302,L]

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
